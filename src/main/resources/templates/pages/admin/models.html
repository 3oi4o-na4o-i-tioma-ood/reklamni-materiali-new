<th:block th:fragment="models">
    <div class="page-content-section">

        <h1 class="title">
            Добавяне на модел
        </h1>

        <div class="add-model">
            <label for="model-name">Име на модела</label>
            <input id="model-name" type="text" class="input">
            <div id="model-name-error" class="error-message"></div>
            <br>

            <label for="model-catalogue-number">Каталожен номер</label>
            <input id="model-catalogue-number" type="text" class="input">
            <div id="model-catalogue-number-error" class="error-message"></div>
            <br>

            <label for="model-price">Цена</label>
            <input id="model-price" type="number" class="input">
            <div id="model-price-error" class="error-message"></div>
            <br>

            <select id="model-size"></select>

            <button id="create-model-button" class="button">Добави</button>
        </div>
    </div>

    <div class="page-content-section">
        <h1 class="title">
            Добавяне на цвят
        </h1>

        <div class="add-model-color">

            <select id="selected-model"></select>
            <br>

            <label for="primary-color">Основен цвят</label>
            <input type="text" class="input" id="primary-color">
            <div id="primary-color-error" class="error-message"></div>
            <br>

            <label for="secondary-color">Вторичен цвят</label>
            <input type="text" class="input" id="secondary-color">
            <div id="secondary-color-error" class="error-message"></div>
            <br>
            
            <label for="color-name">Име на цвета</label>
            <input type="text" class="input" id="color-name">
            <div id="color-name-error" class="error-message"></div>
            <br>

            <div class="page-content-section categories-settings" th:fragment="image-upload-section">
                <h4>
                    Изображение на модела
                </h4>
            
                <!-- <th:block th:replace="components/image_upload :: image-upload('image-upload')"></th:block> -->

                <div id="selected-image-container" style="display: none;">
                    <h4>Избрано изображение</h4>
                    <img src="" alt="" id="selected-image" style="max-width: 100%;">
                </div>

            
                <div class="upload-image-container">
                    <img src="/images/common/upload1.svg" alt="upload"/>
                    <input type="file" id="model-color-image" accept="image/png, image/jpg">
            
                    Drag & drop или
                    <button class="button" id="bg-browse-file-button">Избери файл</button>
                </div>

                <div id="model-color-image-error" class="error-message"></div>

            
                <div class="snackbar bottom middle" id="files-added-snackbar">
                    <img src="/images/common/tick.svg" alt="tick">
            
                    Файловете са добавени!
                </div>
            </div>

            <button id="create-model-color-button" class="button" style="margin-top: 1em;">Добави</button>
        </div>
    </div>

    <div id="models-container" class="models-container page-content-section">
        <div class="model" th:each="model, index : ${models}" th:attr="data-model-id=${model.id}">

            <div class="images-container">
                <img th:each="color, colorIndex : ${model.colors}"
                    th:src="${'/api/model-image?modelColorId=' + color.id}"
                    th:style="${'display:' + (colorIndex.index == 0 ? 'block' : 'none')}">
            </div>

            <div class="info-row">
                <div th:text="${model.model}"></div>
                <div th:text="${model.catalogueNumber}"></div>
                <div style="margin-left: auto" class="model-price-editor">
                    <th:block th:replace="components/number_editing :: number-editing(${model.price}, ${'model-price-' + model.id})"></th:block>
                    <span class="price-suffix">лв.</span>
                </div>
            </div>

            <div class="colors-container">
                <th:block th:each="color, colorIndex : ${model.colors}">
                    <button class="color-circle" th:classappend="${colorIndex.index == 0 ? 'selected' : ''}"
                        th:if="${color.secondaryColor == null}"
                        th:style="${'background-color:' + color.primaryColor}"
                        th:attr="data-model-color-id=${color.id}">
                    </button>
                    <button class="color-circle" th:classappend="${colorIndex.index == 0 ? 'selected' : ''}"
                        th:unless="${color.secondaryColor == null}" th:attr="data-model-color-id=${color.id}">
                        
                        <div class="primary" th:style="${'background-color:' + color.primaryColor}"></div>
                        <div class="secondary" th:style="${'background-color:' + color.secondaryColor}"></div>
                    </button>
                </th:block>
            </div>

            <button class="button small model-popup-button" id="delete-model-button">Изтрий модела</button>
            <button class="button small model-popup-button" id="delete-model-color-button">Изтрий цвета</button>
        </div>
    </div>
</th:block>
